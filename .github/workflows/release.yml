name: Release

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write # Required for npm trusted publishing (OIDC)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Release the main auth application
  semantic-release:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # semantic-release v25 requires Node.js 22.14+
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run release

  # Release the @janovix/auth-ui package to npmjs using Trusted Publishing (OIDC)
  # Configure trusted publisher at: https://www.npmjs.com/package/@janovix/auth-ui/access
  # - Organization: janovix
  # - Repository: auth
  # - Workflow filename: release.yml
  release-ui-package:
    runs-on: ubuntu-latest
    # Explicit permissions for trusted publishing
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # Required for npm trusted publishing (OIDC)
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # npm 11.5.1+ required for trusted publishing
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          # Don't set registry-url - it creates .npmrc that interferes with OIDC
      # npm trusted publishing requires npm 11.5.1+, Node.js 22 comes with npm 10.x
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          echo "npm version: $(npm --version)"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build UI package
        run: pnpm --filter @janovix/auth-ui build
      # Capture version before semantic-release
      - name: Get version before release
        id: version_before
        working-directory: packages/ui
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      # Run semantic-release for versioning, changelog, git, and github release
      # npm publishing is disabled in .releaserc.cjs (we use OIDC below)
      - name: Semantic Release (version + changelog)
        working-directory: packages/ui
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run release
      # Get version after semantic-release (need to pull changes)
      - name: Get version after release
        id: version_after
        working-directory: packages/ui
        run: |
          git pull origin ${{ github.ref_name }} --rebase || true
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      # Publish to npm using OIDC trusted publishing
      # Only publish if version was actually bumped by semantic-release
      - name: Publish to npm (OIDC)
        if: steps.version_before.outputs.version != steps.version_after.outputs.version
        working-directory: packages/ui
        run: |
          VERSION="${{ steps.version_after.outputs.version }}"
          echo "Publishing new version $VERSION..."
          echo "npm version: $(npm --version)"

          # Determine the dist-tag based on branch
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            npm publish --access public --provenance
          else
            npm publish --access public --tag rc --provenance
          fi
      - name: Skip publish (no new version)
        if: steps.version_before.outputs.version == steps.version_after.outputs.version
        run: |
          echo "No new version to publish (version is still ${{ steps.version_before.outputs.version }})"
          echo "Semantic-release did not detect any releasable commits for this package."
